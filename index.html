<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Craft POS V6.1</title>


<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>


</head>


<body>


<header>

<h1>
Craft POS
</h1>

</header>





<nav>


<button onclick="showPage('checkout')">

🛒 Checkout

</button>



<button onclick="showPage('inventory')">

📦 Inventory

</button>



<button onclick="showPage('barcodes')">

🏷️ Barcodes

</button>



<button onclick="showPage('dashboard')">

📊 Dashboard

</button>



<button onclick="showPage('history')">

📜 Sales History

</button>



<button onclick="showPage('craftShow')">

🎪 Craft Show

</button>



<button onclick="showPage('settings')">

⚙️ Settings

</button>


</nav>









<!-- ======================
CHECKOUT PAGE
====================== -->


<section id="checkout" class="page">



<h2>
Checkout
</h2>




<button class="bigButton"
onclick="startScanner()">

📷 Scan Barcode

</button>





<div id="scannerBox" class="hidden">


<div id="scanner"></div>



<button class="bigButton"
onclick="stopScanner()">

Close Scanner

</button>


</div>






<input

id="checkoutSearch"

placeholder="Search products"

oninput="renderCheckout()"

>




<div id="productGrid"></div>








<h2>
Cart
</h2>



<div id="cart"></div>




<h2 id="cartTotal">

Total: $0.00

</h2>





<button class="bigButton"
onclick="openPayment()">

Pay

</button>





<button class="bigButton"
onclick="clearCart()">

Clear Cart

</button>



</section>









<!-- ======================
INVENTORY PAGE
====================== -->


<section id="inventory" class="page hidden">


<h2>
Inventory
</h2>



<button class="bigButton"
onclick="openProductEditor()">

➕ Add Product

</button>





<input

id="inventorySearch"

placeholder="Search inventory"

oninput="renderInventory()"

>




<div id="inventoryList"></div>


</section>









<!-- ======================
BARCODE PAGE
====================== -->


<section id="barcodes" class="page hidden">


<h2>
Barcode Center
</h2>





<input

id="barcodeSearch"

placeholder="Search barcodes"

oninput="renderBarcodes()"

>





<button class="bigButton"
onclick="selectAllBarcodes()">

Select All

</button>





<button class="bigButton"
onclick="clearBarcodeSelection()">

Clear Selection

</button>





<button class="bigButton"
onclick="printSelectedBarcodes()">

Print Selected

</button>





<button class="bigButton"
onclick="printAllBarcodes()">

Print All

</button>





<div id="barcodeList"></div>



</section>









<!-- ======================
DASHBOARD PAGE
====================== -->


<section id="dashboard" class="page hidden">


<h2>
Dashboard
</h2>





<div class="statsCard">


<h3>
Items Sold
</h3>


<p id="itemsSold">

0

</p>


</div>






<div class="statsCard">


<h3>
Inventory Count
</h3>


<p id="inventoryCount">

0

</p>


</div>







<div class="statsCard">


<h3>
Cash Sales
</h3>


<p id="cashTotal">

$0

</p>


</div>






<div class="statsCard">


<h3>
Card Sales
</h3>


<p id="cardTotal">

$0

</p>


</div>






<div class="statsCard">


<h3>
Other Payments
</h3>


<p id="otherTotal">

$0

</p>


</div>





<button class="bigButton"
onclick="clearDashboard()">

Clear Dashboard

</button>



</section>



<!-- ======================
SALES HISTORY PAGE
====================== -->


<section id="history" class="page hidden">


<h2>
Sales History
</h2>




<button class="bigButton"
onclick="clearSalesHistory()">

Clear Sales History

</button>





<div id="historyList"></div>



</section>









<!-- ======================
CRAFT SHOW PAGE
====================== -->


<section id="craftShow" class="page hidden">


<h2>
Craft Show Mode
</h2>





<h3 id="showName">

No Active Show

</h3>




<button class="bigButton"
onclick="startCraftShow()">

Start New Show

</button>





<button class="bigButton"
onclick="endCraftShow()">

End Show

</button>





<div id="showSummary"></div>



</section>









<!-- ======================
PRODUCT EDITOR
====================== -->


<div id="productPopup" class="popup hidden">


<div class="popupBox">


<h2>
Add Product
</h2>





<input

id="productImage"

type="file"

accept="image/*"

>





<img

id="productPreview"

class="itemPreview"

style="display:none"

>





<input

id="productName"

placeholder="Product Name"

>





<input

id="productPrice"

type="number"

placeholder="Price"

>





<input

id="productStock"

type="number"

placeholder="Stock"

>





<input

id="productCategory"

placeholder="Category"

>







<h3>
Product Variations (Optional)
</h3>





<input

id="variationName"

placeholder="Variation Name (Color, Size)"

>





<input

id="variationOptions"

placeholder="Options separated by commas"

>





<button class="bigButton"

onclick="addVariation()">

Add Variation

</button>





<div id="variationList"></div>






<button class="bigButton"

onclick="saveProduct()">

Save Product

</button>





<button class="bigButton"

onclick="closeProductEditor()">

Cancel

</button>



</div>

</div>









<!-- ======================
PAYMENT POPUP
====================== -->


<div id="paymentPopup" class="popup hidden">


<div class="popupBox">



<h2>
Payment Type
</h2>






<button class="paymentButton"

onclick="completePayment('cash')">

💵 Cash

</button>






<button class="paymentButton"

onclick="completePayment('card')">

💳 Card

</button>






<button class="paymentButton"

onclick="completePayment('other')">

Other

</button>






<button class="bigButton"

onclick="closePayment()">

Cancel

</button>



</div>

</div>









<!-- ======================
SETTINGS
====================== -->


<section id="settings" class="page hidden">


<h2>
Settings
</h2>





<button class="bigButton"

onclick="exportBackup()">

Export Backup

</button>






<button class="bigButton"

onclick="document.getElementById('importFile').click()">

Import Backup

</button>





<input

id="importFile"

type="file"

accept=".json"

style="display:none"

onchange="importBackup(event)"

>





<button class="bigButton"

onclick="resetEvent()">

Reset Event Sales

</button>



</section>









<!-- ======================
PRINT AREA
DO NOT REMOVE
====================== -->


<div id="printArea"></div>









<script src="app.js"></script>


</body>


</html>
