<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>POS V12</title>


<link rel="stylesheet" href="style.css">


<!-- Barcode Libraries -->

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>


</head>



<body>



<header>

<h1>POS</h1>

</header>







<main>






<!-- =====================
 DASHBOARD
===================== -->


<section id="dashboard" class="page active">


<h2>Dashboard</h2>




<div class="dashboard-cards">


<div class="dash-card">

<h3>Products</h3>

<span id="totalProducts">

0

</span>


</div>




<div class="dash-card">

<h3>Inventory</h3>

<span id="totalInventory">

0

</span>


</div>





<div class="dash-card">

<h3>Low Stock</h3>

<span id="lowStockCount">

0

</span>


</div>





<div class="dash-card">

<h3>Sales</h3>

<span id="salesCount">

0

</span>


</div>


</div>








<div class="dashboard-section">


<h2>⭐ Best Selling Items</h2>


<div id="bestSellingList"></div>


</div>






<div class="dashboard-section">


<h2>⚠️ Low Stock List</h2>


<div id="lowStockList"></div>


</div>








<div class="dashboard-section">


<h2>✅ To-Do List</h2>


<input 
id="todoInput"
placeholder="Add task"
>


<button onclick="addTodo()">

Add

</button>



<div id="todoList"></div>



</div>








<div class="quick-buttons">


<button onclick="openPage('checkout')">

🛒 Sale

</button>


<button onclick="openPage('products')">

➕ Product

</button>


<button onclick="openPage('inventory')">

📦 Inventory

</button>


<button onclick="openPage('barcode')">

🏷 Barcode

</button>



</div>






</section>














<!-- =====================
 CHECKOUT
===================== -->


<section id="checkout" class="page">


<h2>Checkout</h2>




<div class="checkout-top">


<input

id="productSearch"

placeholder="Search products"

oninput="searchCheckout()"

>


<select id="checkoutCategory">

<option>

All

</option>

</select>



</div>






<div class="checkout-layout">





<div>


<div id="checkoutProducts" class="product-grid"></div>


</div>







<div class="cart-box">


<h2>Cart</h2>



<div id="cartItems"></div>





<h2>

Total $

<span id="cartTotal">

0.00

</span>


</h2>






<button onclick="clearCart()">

Clear

</button>



<button onclick="checkoutPayment('Cash')">

💵 Cash

</button>




<button onclick="checkoutPayment('Card')">

💳 Card

</button>




</div>







</div>



</section>














<!-- =====================
 PRODUCTS
===================== -->


<section id="products" class="page">


<h2>Products</h2>




<button onclick="openAddProduct()">

➕ Add Product

</button>




<div id="productList"></div>





</section>














<!-- =====================
 ADD / EDIT PRODUCT
===================== -->


<section id="productEditor" class="page">


<h2 id="editorTitle">

Add Product

</h2>




<input id="productName"
placeholder="Product Name"
>




<input id="productPrice"
type="number"
placeholder="Price"
>




<input id="productStock"
type="number"
placeholder="Stock"
>




<select id="productCategory"></select>





<input id="productBarcode"
placeholder="Barcode"
>




<button onclick="createBarcode()">

Generate Barcode

</button>






<input 
id="productImage"
type="file"
accept="image/*"
>





<button onclick="saveProduct()">

Save Product

</button>






</section>













<!-- =====================
 INVENTORY
===================== -->


<section id="inventory" class="page">


<h2>Inventory</h2>



<div id="inventoryList"></div>



</section>









<!-- =====================
 BARCODE CENTER
===================== -->


<section id="barcode" class="page">


<h2>🏷 Barcode Center</h2>





<div class="barcode-toolbar">



<input

id="barcodeSearch"

placeholder="Search products"

oninput="searchBarcodes()"

>




<select id="barcodeCategory">

<option>

All

</option>

</select>





<select id="labelSize">


<option value="2x1">

2 x 1 inch

</option>



<option value="2.625x1">

2.625 x 1 inch

</option>



<option value="3.33x2">

3.33 x 2 inch

</option>



<option value="full">

Full Page

</option>



</select>







<button onclick="selectAllLabels()">

☑ Select All

</button>




<button onclick="clearLabels()">

Clear

</button>






<input

id="selectedCopies"

type="number"

value="1"

min="1"

placeholder="Copies"

>




<button onclick="printSelectedLabels()">

🖨 Print Selected

</button>






<button onclick="printAllLabels()">

🖨 Print All

</button>



</div>








<div id="barcodeProducts"></div>








<div id="printArea"></div>




</section>















<!-- =====================
 SCANNER
===================== -->


<section id="scanner" class="page">


<h2>📷 Scanner</h2>





<select id="scanAction">


<option value="cart">

Add To Cart

</option>



<option value="add">

Add Stock +1

</option>



<option value="remove">

Remove Stock -1

</option>



</select>






<div id="cameraBox"></div>





<button onclick="startCameraScanner()">

Start Camera

</button>




<button onclick="stopCameraScanner()">

Stop Camera

</button>







<h3>

Bluetooth / USB Scanner

</h3>



<input

id="scannerInput"

placeholder="Scan barcode here"

onchange="scannerInputScan()"

>






<div id="scannerMessage"></div>




</section>














<!-- =====================
 CATEGORIES
===================== -->


<section id="categories" class="page">


<h2>⚙️ Categories</h2>






<input

id="newCategory"

placeholder="Category Name"

>





<button onclick="addCategory()">

Add Category

</button>






<div id="categoryList"></div>



</section>













<!-- =====================
 SALES
===================== -->


<section id="sales" class="page">


<h2>🧾 Sales History</h2>




<div id="salesList"></div>




<button onclick="clearSales()">

Clear Sales

</button>



</section>














</main>












<!-- =====================
 NAVIGATION
===================== -->


<nav>


<button onclick="openPage('dashboard')">

⌂

</button>




<button onclick="openPage('checkout')">

🛒

</button>




<button onclick="openPage('products')">

📦

</button>





<button onclick="openPage('scanner')">

📷

</button>





<button onclick="openPage('barcode')">

🏷

</button>





<button onclick="openPage('categories')">

⚙️

</button>





</nav>









<script src="app.js"></script>


</body>


</html>
