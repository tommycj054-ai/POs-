<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Craft POS V5.1</title>


<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>


</head>



<body>


<header>

<h1>
Craft POS
</h1>

</header>






<nav>


<button onclick="showPage('inventory')">

📦 Inventory

</button>



<button onclick="showPage('checkout')">

🛒 Checkout

</button>



<button onclick="showPage('barcodes')">

🏷️ Barcodes

</button>



<button onclick="showPage('alerts')">

🚨 Alerts

</button>



<button onclick="showPage('dashboard')">

📊 Dashboard

</button>



<button onclick="showPage('settings')">

⚙️ Settings

</button>



</nav>









<!-- =====================
INVENTORY
===================== -->


<section id="inventory" class="page">


<h2>
Inventory
</h2>



<button class="bigButton"

onclick="openItemEditor()">

➕ Add Item

</button>





<input

id="inventorySearch"

placeholder="Search items"

oninput="renderInventory()">





<div id="inventoryList">

</div>



</section>









<!-- =====================
CHECKOUT
===================== -->


<section id="checkout" class="page hidden">


<h2>
Checkout
</h2>



<button class="bigButton"

onclick="startScanner()">

📷 Scan Barcode

</button>




<div id="scannerBox" class="hidden">


<div id="scanner"></div>



<button class="bigButton"

onclick="stopScanner()">

Close Camera

</button>


</div>







<input

id="checkoutSearch"

placeholder="Search products"

oninput="renderCheckout()">





<div id="productGrid">

</div>







<h2>
Cart
</h2>



<div id="cart">

</div>




<h2 id="cartTotal">

Total: $0.00

</h2>






<button class="bigButton"

onclick="openPayment()">

Checkout

</button>




<button class="bigButton"

onclick="clearCart()">

Clear Cart

</button>




</section>









<!-- =====================
BARCODES ONLY PAGE
===================== -->


<section id="barcodes" class="page hidden">


<h2>
Barcode Center
</h2>




<input

id="barcodeSearch"

placeholder="Search barcodes"

oninput="renderBarcodes()">





<button class="bigButton"

onclick="selectAllBarcodes()">

Select All

</button>




<button class="bigButton"

onclick="clearBarcodeSelection()">

Clear Selection

</button>




<button class="bigButton"

onclick="printSelectedBarcodes()">

Print Selected

</button>




<button class="bigButton"

onclick="printAllBarcodes()">

Print All

</button>







<div id="barcodeList">

</div>




</section>









<!-- =====================
ALERTS
===================== -->


<section id="alerts" class="page hidden">


<h2>
Stock Alerts
</h2>



<div id="alertsList">

</div>



</section>









<!-- =====================
DASHBOARD
===================== -->


<section id="dashboard" class="page hidden">


<h2>
Dashboard
</h2>




<div class="statsCard">

<h3>
Total Sales
</h3>

<p id="totalSales">

$0

</p>

</div>






<div class="statsCard">

<h3>
Items Sold
</h3>

<p id="itemsSold">

0

</p>

</div>







<div class="statsCard">

<h3>
Inventory Count
</h3>

<p id="inventoryCount">

0

</p>

</div>







<div class="statsCard">

<h3>
Payments
</h3>


<p>

Cash:
<span id="cashTotal">$0</span>

</p>


<p>

Card:
<span id="cardTotal">$0</span>

</p>



<p>

Other:
<span id="otherTotal">$0</span>

</p>


</div>






<button class="bigButton"

onclick="resetEvent()">

Reset Event Sales

</button>



</section>









<!-- =====================
SETTINGS
===================== -->


<section id="settings" class="page hidden">


<h2>
Settings
</h2>




<button class="bigButton"

onclick="exportBackup()">

Export Backup

</button>




<button class="bigButton"

onclick="document.getElementById('importFile').click()">

Import Backup

</button>




<input

id="importFile"

type="file"

style="display:none"

accept=".json"

onchange="importBackup(event)">





</section>









<!-- =====================
ITEM EDITOR
===================== -->


<div id="itemPopup" class="popup hidden">


<div class="popupBox">


<h2>
Add Item
</h2>



<input

id="itemPicture"

type="file"

accept="image/*"

capture="environment">





<img

id="itemPreview"

style="display:none"

class="itemPreview">





<input

id="itemName"

placeholder="Item name">





<input

id="itemPrice"

type="number"

placeholder="Price">





<input

id="itemStock"

type="number"

placeholder="Stock">





<input

id="itemLowStock"

type="number"

placeholder="Low stock alert"

value="3">





<button class="bigButton"

onclick="saveItem()">

Save

</button>




<button class="bigButton"

onclick="closeItemEditor()">

Cancel

</button>



</div>

</div>









<!-- =====================
PAYMENT
===================== -->


<div id="paymentPopup" class="popup hidden">


<div class="popupBox">


<h2>
Payment
</h2>




<button class="paymentButton"

onclick="completePayment('cash')">

Cash

</button>



<button class="paymentButton"

onclick="completePayment('card')">

Card

</button>




<button class="paymentButton"

onclick="completePayment('other')">

Other

</button>



</div>

</div>









<!-- PRINT AREA -->

<div id="printArea"></div>







<script src="app.js"></script>


</body>

</html>
