<!DOCTYPE html>
<html>

<head>

<title>POS V9</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>POS</h1>

</header>



<main>





<!-- DASHBOARD -->

<section id="dashboard" class="page active">


<h2>Dashboard</h2>


<div class="cards">


<div class="card">
<h3>Products</h3>
<p id="productCount">0</p>
</div>


<div class="card">
<h3>Total Stock</h3>
<p id="inventoryCount">0</p>
</div>


<div class="card">
<h3>Low Stock</h3>
<p id="lowStock">0</p>
</div>


<div class="card">
<h3>Items Sold</h3>
<p id="itemsSold">0</p>
</div>


</div>







<h2>⚡ Quick Actions</h2>


<div class="quick-buttons">


<button onclick="showPage('addProduct')">
➕ Add Product
</button>


<button onclick="showPage('inventory')">
📦 Inventory
</button>


<button onclick="showPage('checkout')">
🛒 New Sale
</button>


<button onclick="showPage('categories')">
⚙️ Categories
</button>


</div>







<div class="dashboard-box">

<h2>⚠️ Low Stock</h2>

<div id="lowStockList"></div>

</div>







<div class="dashboard-box">

<h2>⭐ Best Sellers</h2>

<div id="bestSellers"></div>

</div>







<div class="dashboard-box">

<h2>📦 Category Stock</h2>

<div id="categoryStock"></div>

</div>








<div class="dashboard-box">


<h2>📝 To-Do List</h2>


<input id="todoInput" placeholder="New task">


<button onclick="addTodo()">
Add
</button>


<div id="todoList"></div>


</div>



</section>









<!-- CHECKOUT -->

<section id="checkout" class="page">


<h2>Checkout</h2>



<div id="categoryButtons" class="categories"></div>





<input
id="search"
placeholder="Search Products..."
oninput="searchProducts()"
>




<div class="checkout-layout">


<div id="products" class="product-grid"></div>




<div class="cart">


<h2>Cart</h2>


<div id="cartItems"></div>



<h2>
$
<span id="total">0</span>
</h2>



<button onclick="clearCart">
Clear
</button>



<button class="black" onclick="pay('Cash')">

💵 Cash

</button>



<button class="black" onclick="pay('Card')">

💳 Card

</button>



</div>


</div>



</section>









<!-- ADD PRODUCT -->


<section id="addProduct" class="page">


<h2>Add Product</h2>




<input
id="productName"
placeholder="Product Name"
>




<input
id="productPrice"
placeholder="Price"
type="number"
>




<input
id="productStock"
placeholder="Stock"
type="number"
>




<select id="productCategory">

</select>






<label>
Picture
</label>


<input
id="productImage"
type="file"
accept="image/*"
>





<button onclick="saveProduct()">

Save Product

</button>



</section>









<!-- EDIT PRODUCT -->


<section id="editProduct" class="page">


<h2>Edit Product</h2>



<input id="editName">


<input id="editPrice" type="number">


<input id="editStock" type="number">




<select id="editCategory">

</select>




<input
id="editImage"
type="file"
accept="image/*"
>




<button onclick="updateProduct()">

Save Changes

</button>



</section>









<!-- CATEGORIES -->


<section id="categories" class="page">


<h2>⚙️ Categories</h2>




<input
id="categoryName"
placeholder="New Category Name"
>




<button onclick="addCategory()">

➕ Add Category

</button>





<div id="categoryList"></div>



</section>









<!-- INVENTORY -->


<section id="inventory" class="page">


<h2>Inventory</h2>


<div id="inventoryList"></div>


</section>









<!-- SALES -->


<section id="sales" class="page">


<h2>Sales History</h2>


<div id="salesList"></div>



<button onclick="clearSales()">

Clear Sales

</button>


</section>









</main>









<nav>


<button onclick="showPage('dashboard')">
⌂
</button>



<button onclick="showPage('checkout')">
🛒
</button>



<button onclick="showPage('addProduct')">
➕
</button>



<button onclick="showPage('inventory')">
📦
</button>



<button onclick="showPage('categories')">
⚙️
</button>



<button onclick="showPage('sales')">
🧾
</button>



</nav>







<script src="app.js"></script>


</body>

</html>
